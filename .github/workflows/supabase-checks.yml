name: Supabase Checks

on:
  pull_request:
    branches: [main]
    paths:
      - apps/supabase/**
      - .github/workflows/supabase-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Supabase checks
    uses: elyon-labs/workflows/.github/workflows/validate-supabase.yml@381588c0b1a8e3ae15d52230a20fdd88ef584f1c # v1.0.0
    with:
      working-directory: apps/supabase
      functions-directory: apps/supabase/functions
      supabase-cli-version: "2.95.4"
      deno-version: "2.2.12"
      validate-edge-functions: true
      validate-database: true
      run-function-tests: false
    permissions:
      contents: read
