name: Pull Request Checks

on:
  pull_request:
    branches: [main]
    paths:
      - apps/mobile/**
      - apps/server/**
      - melos.yaml
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/pull_request_checks.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    name: Flutter and Dart checks
    uses: elyon-labs/workflows/.github/workflows/validate-flutter-melos.yml@381588c0b1a8e3ae15d52230a20fdd88ef584f1c # v1.0.0
    with:
      flutter-version: "3.41.4"
      melos-version: "6.2.0"
    permissions:
      contents: read
