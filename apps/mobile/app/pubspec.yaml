  syncfusion_flutter_core: ^30.1.41
  syncfusion_flutter_datepicker: ^30.1.41
  time_machine: ^0.9.17
  timelines_plus: ^1.0.3
  timezone: ^0.9.4
  universal_platform: ^1.1.0
  universal_web: ^1.1.1
  url_launcher: ^6.3.0
  uuid: ^4.4.0
  version: ^3.0.2
  ynab_api_models:
    path: ../ynab_api_models

dev_dependencies:
  bloc_test: ^9.1.7
  build_runner: ^2.4.12
  charlatan: ^0.4.0
  dart_mappable_builder: ^4.3.0
  drift_dev: ^2.22.1
  faker: ^2.2.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.0
  flutter_test:
    sdk: flutter
  test: ^1.25.7

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Thin.ttf
          weight: 100
        - asset: assets/fonts/Outfit-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Outfit-Black.ttf
          weight: 900
  assets:
    - assets/
    - assets/fonts/
    - assets/images/
    - assets/images/ynab/
    - shorebird.yaml

flutter_native_splash:
  color: "#000000"
  image: assets/icon_transparent.png
  color_dark: "#000000"
  android_12:
    image: assets/icon_transparent.png
    color: "#000000"
    color_dark: "#000000"
